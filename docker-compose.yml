services:
  mysql:
    image: mysql:8.0
    container_name: scheduler-mysql
    ports:
      # 로컬에 이미 mysqld가 3306을 점유 중이라 호스트는 3307로 노출
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: scheduler123
      MYSQL_DATABASE: scheduler
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pscheduler123"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: scheduler-backend
    ports:
      - "5004:5004"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: scheduler123
      DB_NAME: scheduler
      JWT_SECRET: ${JWT_SECRET:-the-scheduler-jwt-secret-change-me}
      DB_BASELINE_ON_MIGRATE: ${DB_BASELINE_ON_MIGRATE:-false}
      PORT: 5004
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: scheduler-frontend
    ports:
      - "5003:80"
    depends_on:
      - backend

volumes:
  mysql-data:
